name: Fetch Clan Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        env:
          CLASH_ROYALE_TOKEN: ${{ secrets.CLASH_ROYALE_TOKEN }}
        run: python fetch_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clan_data.json history_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update clan data" && git push)
