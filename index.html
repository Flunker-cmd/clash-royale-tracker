<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikea Clan Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 4px;
      color: #38bdf8;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background-color: #334155;
      color: #94a3b8;
      font-weight: 600;
    }
    tr {
      border-bottom: 1px solid #334155;
    }
    tr:nth-child(even) { background-color: #1e293b; }
    tr:nth-child(odd) { background-color: #182232; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }
    .role {
      font-size: 0.8em;
      color: #94a3b8;
      text-transform: capitalize;
    }
    .promote { background: #065f46; color: #34d399; }
    .good { background: #1e3a8a; color: #93c5fd; }
    .review { background: #78350f; color: #fde047; }
    .kick { background: #831843; color: #f472b6; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Ikea Clan Management Dashboard</h1>
    <p class="subtitle" id="subtitle">Loading member & history data...</p>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Role</th>
          <th>Donations</th>
          <th>Avg Fame / Wk</th>
          <th>Total Decks</th>
          <th>War Loyalty</th>
          <th>Action / Recommendation</th>
        </tr>
      </thead>
      <tbody id="member-table">
      </tbody>
    </table>
  </div>

  <script>
    const CLAN_TAG = "#L0G0Y0JP";

    const roleNames = {
      leader: "Leader",
      coLeader: "Co-Leader",
      elder: "Elder",
      member: "Member"
    };

    async function loadDashboard() {
      try {
        const [membersRes, historyRes] = await Promise.all([
          fetch('clan_members.json'),
          fetch('history_data.json')
        ]);

        const membersData = await membersRes.json();
        const historyData = await historyRes.json();

        const currentMembers = membersData.memberList || [];
        const historyRaces = historyData.items || [];
        const totalWeeks = historyRaces.length || 1;

        const warStats = {};
        historyRaces.forEach(race => {
          const standing = race.standings?.find(s => s.clan.tag === CLAN_TAG);
          if (!standing) return;
          (standing.clan.participants || []).forEach(p => {
            if (!warStats[p.tag]) {
              warStats[p.tag] = { fame: 0, decks: 0, weeks: 0 };
            }
            warStats[p.tag].fame += p.fame || 0;
            warStats[p.tag].decks += p.decksUsed || 0;
            warStats[p.tag].weeks += 1;
          });
        });

        const combined = currentMembers.map(m => {
          const war = warStats[m.tag] || { fame: 0, decks: 0, weeks: 0 };
          const avgFame = Math.round(war.fame / totalWeeks);
          return {
            tag: m.tag,
            name: m.name,
            role: m.role,
            donations: m.donations || 0,
            donationsReceived: m.donationsReceived || 0,
            fame: war.fame,
            avgFame: avgFame,
            decks: war.decks,
            weeks: war.weeks
          };
        }).sort((a, b) => b.avgFame - a.avgFame);

        document.getElementById('subtitle').textContent = 
          `Active Members: ${currentMembers.length} | Evaluated over last ${totalWeeks} war weeks`;

        const tbody = document.getElementById('member-table');
        tbody.innerHTML = '';

        combined.forEach((m, index) => {
          let rec = '<span class="badge good">Good Standing</span>';

          if (m.role === 'member' && m.avgFame >= 1800 && m.donations >= 100) {
            rec = '<span class="badge promote">Promote to Elder</span>';
          } else if (m.role === 'elder' && m.avgFame >= 2500 && m.donations >= 250) {
            rec = '<span class="badge promote">Promote Candidate</span>';
          } else if (m.role === 'member' && m.avgFame < 400 && m.donations < 30) {
            rec = '<span class="badge kick">Kick Candidate</span>';
          } else if (['coLeader', 'elder'].includes(m.role) && m.avgFame < 600) {
            rec = '<span class="badge review">Demote / Review</span>';
          } else if (m.weeks < Math.ceil(totalWeeks / 2)) {
            rec = '<span class="badge review">New / Inactive in War</span>';
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${m.name}</strong></td>
            <td><span class="role">${roleNames[m.role] || m.role}</span></td>
            <td>${m.donations}</td>
            <td>${m.avgFame.toLocaleString()}</td>
            <td>${m.decks}</td>
            <td>${m.weeks} / ${totalWeeks} wk</td>
            <td>${rec}</td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        document.getElementById('subtitle').textContent = 'Error loading dashboard data. Make sure fetch action has run.';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
