<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikea Clan Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1250px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 4px;
      color: #38bdf8;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
    }
    .stat-card .label {
      color: #94a3b8;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .stat-card .value {
      font-size: 1.5em;
      font-weight: bold;
      color: #38bdf8;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background-color: #334155;
      color: #94a3b8;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    th:hover {
      background-color: #475569;
      color: #f8fafc;
    }
    tr {
      border-bottom: 1px solid #334155;
    }
    tr:nth-child(even) { background-color: #1e293b; }
    tr:nth-child(odd) { background-color: #182232; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }
    .role {
      font-size: 0.8em;
      color: #94a3b8;
      text-transform: capitalize;
    }
    .promote { background: #065f46; color: #34d399; }
    .good { background: #1e3a8a; color: #93c5fd; }
    .review { background: #78350f; color: #fde047; }
    .kick { background: #831843; color: #f472b6; }
    
    .loyalty-cell {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .timeline {
      display: flex;
      gap: 3px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }
    .dot.full { background-color: #10b981; }
    .dot.partial { background-color: #f59e0b; }
    .dot.missed { background-color: #ef4444; }
    .dot.none { background-color: #334155; opacity: 0.4; }
    .loyalty-text {
      font-size: 0.85em;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Ikea Clan Management Dashboard</h1>
    <p class="subtitle" id="subtitle">Loading member & history data...</p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">War Trophies</div>
        <div class="value" id="stat-trophies">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Avg Weekly Clan Fame</div>
        <div class="value" id="stat-fame">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Active War Warriors</div>
        <div class="value" id="stat-active">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Top Performer</div>
        <div class="value" id="stat-top">-</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th onclick="sortTable('index')"># <span id="sort-index"></span></th>
          <th onclick="sortTable('name')">Player <span id="sort-name"></span></th>
          <th onclick="sortTable('role')">Role <span id="sort-role"></span></th>
          <th onclick="sortTable('donations')">Donations <span id="sort-donations"></span></th>
          <th onclick="sortTable('avgFame')">Avg Fame / Wk <span id="sort-avgFame"></span></th>
          <th onclick="sortTable('decks')">Total Decks <span id="sort-decks"></span></th>
          <th onclick="sortTable('weeks')">War Loyalty <span id="sort-weeks"></span></th>
          <th onclick="sortTable('recommendationWeight')">Action / Recommendation <span id="sort-recommendationWeight"></span></th>
        </tr>
      </thead>
      <tbody id="member-table">
      </tbody>
    </table>
  </div>

  <script>
    const CLAN_TAG = "#L0G0Y0JP";

    const roleNames = {
      leader: "Leader",
      coLeader: "Co-Leader",
      elder: "Elder",
      member: "Member"
    };

    const roleOrder = {
      leader: 4,
      coLeader: 3,
      elder: 2,
      member: 1
    };

    let combinedData = [];
    let currentSortColumn = 'role';
    let currentSortAsc = false;

    async function loadDashboard() {
      try {
        const [membersRes, historyRes] = await Promise.all([
          fetch('clan_members.json'),
          fetch('history_data.json')
        ]);

        const membersData = await membersRes.json();
        const historyData = await historyRes.json();

        const currentMembers = membersData.memberList || [];
        const historyRaces = historyData.items || [];
        const totalWeeks = historyRaces.length || 1;

        const warStats = {};
        historyRaces.forEach((race, weekIndex) => {
          const standing = race.standings?.find(s => s.clan.tag === CLAN_TAG);
          if (!standing) return;
          (standing.clan.participants || []).forEach(p => {
            if (!warStats[p.tag]) {
              warStats[p.tag] = { fame: 0, decks: 0, weeks: 0, history: new Array(totalWeeks).fill(null) };
            }
            const decksUsed = p.decksUsed || 0;
            warStats[p.tag].fame += p.fame || 0;
            warStats[p.tag].decks += decksUsed;
            warStats[p.tag].weeks += 1;
            warStats[p.tag].history[weekIndex] = decksUsed;
          });
        });

        let totalClanAvgFame = 0;
        let activeWarriorsCount = 0;

        combinedData = currentMembers.map(m => {
          const war = warStats[m.tag] || { fame: 0, decks: 0, weeks: 0, history: new Array(totalWeeks).fill(null) };
          const activeWeeks = war.weeks || 0;
          const avgFame = activeWeeks > 0 ? Math.round(war.fame / activeWeeks) : 0;

          totalClanAvgFame += avgFame;
          if (activeWeeks >= Math.ceil(totalWeeks / 2)) {
            activeWarriorsCount++;
          }

          let firstSeenIndex = -1;
          for (let i = totalWeeks - 1; i >= 0; i--) {
            if (war.history[i] !== null) {
              firstSeenIndex = i;
              break;
            }
          }

          let tenureWeeks = firstSeenIndex !== -1 ? (firstSeenIndex + 1) : 0;
          let loyaltyRatio = tenureWeeks > 0 ? `${activeWeeks} / ${tenureWeeks} wk` : "0 / 0 wk";

          let dotsHtml = '<div class="timeline">';
          for (let i = totalWeeks - 1; i >= 0; i--) {
            const decks = war.history[i];
            if (decks !== null && decks >= 16) {
              dotsHtml += `<div class="dot full" title="${decks}/16 decks used"></div>`;
            } else if (decks !== null && decks > 0) {
              dotsHtml += `<div class="dot partial" title="${decks}/16 decks used"></div>`;
            } else if (decks !== null && decks === 0) {
              dotsHtml += `<div class="dot missed" title="0/16 decks used"></div>`;
            } else if (firstSeenIndex !== -1 && i <= firstSeenIndex) {
              dotsHtml += `<div class="dot missed" title="Missed war"></div>`;
            } else {
              dotsHtml += `<div class="dot none" title="Not in clan"></div>`;
            }
          }
          dotsHtml += '</div>';

          let recText = "Good Standing";
          let recWeight = 3;
          let recClass = "good";

          if (activeWeeks < Math.ceil(totalWeeks / 2)) {
            recText = "New / Low History";
            recWeight = 2;
            recClass = "review";
          } else if (m.role === 'member' && avgFame >= 1800 && (m.donations || 0) >= 50) {
            recText = "Promote to Elder";
            recWeight = 5;
            recClass = "promote";
          } else if (m.role === 'elder' && avgFame >= 2500 && (m.donations || 0) >= 100) {
            recText = "Promote Candidate";
            recWeight = 5;
            recClass = "promote";
          } else if (['coLeader', 'elder'].includes(m.role) && avgFame < 600) {
            recText = "Demote / Review";
            recWeight = 1;
            recClass = "review";
          } else if (m.role === 'member' && avgFame < 400 && (m.donations || 0) < 30) {
            recText = "Kick Candidate";
            recWeight = 0;
            recClass = "kick";
          }

          return {
            tag: m.tag,
            name: m.name,
            role: m.role,
            roleWeight: roleOrder[m.role] || 0,
            donations: m.donations || 0,
            fame: war.fame,
            avgFame: avgFame,
            decks: war.decks,
            weeks: activeWeeks,
            tenureWeeks: tenureWeeks,
            loyaltyRatio: loyaltyRatio,
            dotsHtml: dotsHtml,
            totalWeeks: totalWeeks,
            recommendationText: recText,
            recommendationWeight: recWeight,
            recommendationClass: recClass
          };
        });

        const topPlayer = [...combinedData].sort((a, b) => b.avgFame - a.avgFame)[0];

        document.getElementById('stat-trophies').textContent = (membersData.clanWarTrophies || 0).toLocaleString();
        document.getElementById('stat-fame').textContent = totalClanAvgFame.toLocaleString();
        document.getElementById('stat-active').textContent = `${activeWarriorsCount} / ${currentMembers.length}`;
        document.getElementById('stat-top').textContent = topPlayer ? topPlayer.name : '-';

        document.getElementById('subtitle').textContent = 
          `Active Members: ${currentMembers.length} | Evaluated over last ${totalWeeks} war weeks`;

        renderTable();

      } catch (err) {
        document.getElementById('subtitle').textContent = 'Error loading dashboard data.';
      }
    }

    function sortTable(column) {
      if (currentSortColumn === column) {
        currentSortAsc = !currentSortAsc;
      } else {
        currentSortColumn = column;
        currentSortAsc = (column === 'name');
      }
      renderTable();
    }

    function renderTable() {
      let sorted = [...combinedData];

      sorted.sort((a, b) => {
        let valA, valB;

        if (currentSortColumn === 'role') {
          valA = a.roleWeight;
          valB = b.roleWeight;
        } else if (currentSortColumn === 'index') {
          valA = a.avgFame;
          valB = b.avgFame;
        } else {
          valA = a[currentSortColumn];
          valB = b[currentSortColumn];
        }

        if (typeof valA === 'string') {
          return currentSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return currentSortAsc ? valA - valB : valB - valA;
      });

      ['index', 'name', 'role', 'donations', 'avgFame', 'decks', 'weeks', 'recommendationWeight'].forEach(col => {
        const el = document.getElementById(`sort-${col}`);
        if (el) {
          el.textContent = col === currentSortColumn ? (currentSortAsc ? '▲' : '▼') : '';
        }
      });

      const tbody = document.getElementById('member-table');
      tbody.innerHTML = '';

      sorted.forEach((m, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${m.name}</strong></td>
          <td><span class="role">${roleNames[m.role] || m.role}</span></td>
          <td>${m.donations}</td>
          <td>${m.avgFame.toLocaleString()}</td>
          <td>${m.decks}</td>
          <td>
            <div class="loyalty-cell">
              ${m.dotsHtml}
              <span class="loyalty-text">${m.loyaltyRatio}</span>
            </div>
          </td>
          <td><span class="badge ${m.recommendationClass}">${m.recommendationText}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadDashboard();
  </script>
</body>
</html>
