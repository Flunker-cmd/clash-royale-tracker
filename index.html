<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikea Clan Management</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 4px;
      color: #38bdf8;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background-color: #334155;
      color: #94a3b8;
      font-weight: 600;
    }
    tr {
      border-bottom: 1px solid #334155;
    }
    tr:nth-child(even) {
      background-color: #1e293b;
    }
    tr:nth-child(odd) {
      background-color: #182232;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }
    .promote { background: #065f46; color: #34d399; }
    .good { background: #1e3a8a; color: #93c5fd; }
    .warning { background: #78350f; color: #fde047; }
    .kick { background: #831843; color: #f472b6; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Clan Performance History</h1>
    <p class="subtitle" id="subtitle">Loading history data...</p>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>Total Fame</th>
          <th>Avg Fame / Week</th>
          <th>Total Decks Used</th>
          <th>Weeks Active</th>
          <th>Recommendation</th>
        </tr>
      </thead>
      <tbody id="member-table">
      </tbody>
    </table>
  </div>

  <script>
    const CLAN_TAG = "#L0G0Y0JP";

    async function loadHistory() {
      try {
        const response = await fetch('history_data.json');
        const data = await response.json();
        
        const historyRaces = data.items || [];
        const totalWeeks = historyRaces.length;

        if (totalWeeks === 0) {
          document.getElementById('subtitle').textContent = 'No historical race data found.';
          return;
        }

        const playerStats = {};

        historyRaces.forEach(race => {
          const myClanStanding = race.standings?.find(s => s.clan.tag === CLAN_TAG);
          if (!myClanStanding) return;

          const participants = myClanStanding.clan.participants || [];
          participants.forEach(p => {
            if (!playerStats[p.tag]) {
              playerStats[p.tag] = {
                name: p.name,
                totalFame: 0,
                totalDecks: 0,
                weeksParticipated: 0
              };
            }

            playerStats[p.tag].totalFame += p.fame || 0;
            playerStats[p.tag].totalDecks += p.decksUsed || 0;
            playerStats[p.tag].weeksParticipated += 1;
          });
        });

        const members = Object.values(playerStats).sort((a, b) => b.totalFame - a.totalFame);
        
        document.getElementById('subtitle').textContent = `Aggregated statistics over the last ${totalWeeks} completed weeks.`;

        const tbody = document.getElementById('member-table');
        tbody.innerHTML = '';

        members.forEach((m, index) => {
          const avgFame = Math.round(m.totalFame / totalWeeks);
          
          let recommendation = '<span class="badge good">Stable</span>';
          if (avgFame >= 2000 && m.weeksParticipated >= totalWeeks - 1) {
            recommendation = '<span class="badge promote">Promote Candidate</span>';
          } else if (avgFame < 500 && m.weeksParticipated >= 2) {
            recommendation = '<span class="badge kick">Kick Candidate</span>';
          } else if (m.weeksParticipated < Math.ceil(totalWeeks / 2)) {
            recommendation = '<span class="badge warning">Low Attendance</span>';
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${m.name}</strong></td>
            <td>${m.totalFame.toLocaleString()}</td>
            <td>${avgFame.toLocaleString()}</td>
            <td>${m.totalDecks}</td>
            <td>${m.weeksParticipated} / ${totalWeeks}</td>
            <td>${recommendation}</td>
          `;
          tbody.appendChild(tr);
        });

      } catch (err) {
        document.getElementById('subtitle').textContent = 'Error loading history_data.json.';
      }
    }

    loadHistory();
  </script>
</body>
</html>
