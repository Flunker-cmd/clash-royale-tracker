<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikea Clan Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
    }
    th {
      background-color: #334155;
      color: #94a3b8;
      font-weight: 600;
    }
    tr {
      border-bottom: 1px solid #334155;
    }
    tr:nth-child(even) {
      background-color: #1e293b;
    }
    tr:nth-child(odd) {
      background-color: #182232;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }
    .top { background: #065f46; color: #34d399; }
    .low { background: #831843; color: #f472b6; }
    .active { background: #1e3a8a; color: #93c5fd; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="clan-name">Klanstatistik</h1>
    <p class="subtitle" id="last-updated">Laddar data...</p>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Spelare</th>
          <th>Fame</th>
          <th>Däck använda (Idag)</th>
          <th>Båtattacker</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="member-table">
      </tbody>
    </table>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('clan_data.json');
        const data = await response.json();
        
        const clan = data.clan;
        const members = clan.participants.sort((a, b) => b.fame - a.fame);
        
        // Räkna ut klanens totala fame manuellt ifall clan.fame är 0
        const totalFame = members.reduce((sum, m) => sum + (m.fame || 0), 0);
        
        document.getElementById('clan-name').textContent = clan.name + " - Krigsstatus";
        document.getElementById('last-updated').textContent = `Totalt klan-fame: ${totalFame}`;

        const tbody = document.getElementById('member-table');
        tbody.innerHTML = '';

        members.forEach((m, index) => {
          const tr = document.createElement('tr');
          
          let statusBadge = '<span class="badge low">Ingen aktivitet</span>';
          if (m.fame > 0) {
            statusBadge = index < 5 ? '<span class="badge top">Toppstrid</span>' : '<span class="badge active">Aktiv</span>';
          }

          const decksToday = m.decksUsedToday !== undefined ? m.decksUsedToday : m.decksUsed;

          tr.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${m.name}</strong></td>
            <td>${m.fame}</td>
            <td>${decksToday} / 4</td>
            <td>${m.boatAttacks}</td>
            <td>${statusBadge}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('last-updated').textContent = 'Kunde inte ladda clan_data.json ännu.';
      }
    }

    loadData();
  </script>
</body>
</html>
